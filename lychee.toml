# Lychee link-checker config
# Used by `.github/workflows/ci.yml` Documentation Links job.

# Skip placeholders for the paper DOI and the Zenodo software-release
# DOI; both are filled in once the corresponding artefacts are published.
# Skip the SAGE Methods URL — server returns a redirect loop on automated
# checkers (works fine in browsers). Skip the Zenodo GitHub settings URL
# because it intermittently returns gateway errors to automated checks.
exclude = [
    "doi\\.org/10\\.1016/j\\.softx\\.2026\\.XXXXXX",
    "doi\\.org/10\\.5281/zenodo\\.XXXXXXX",
    "doi\\.org/10\\.4135/9781446251911",
    "zenodo\\.org/account/settings/github/",
    # Local dev-stack URLs (Vite :5173, API :8000, MinIO console :9001, …) are
    # never reachable from CI and are never legitimate published links, so
    # exclude every localhost reference rather than enumerating ports.
    "localhost",
    # Commercial Q-software vendor site cited in the README comparison table;
    # resolves in browsers/curl but bot-protection can block automated checkers.
    "qmethodsoftware\\.com",
    # Taylor & Francis Q-methodology citations in q-methodology.md. Both DOIs
    # resolve through doi.org to tandfonline.com, which returns 403 to automated
    # checkers while resolving fine in browsers — same bot-protection case as
    # qmethodsoftware above. Excluded by their doi.org source URL, not the
    # tandfonline redirect target: lychee matches `exclude` against the link as
    # written before following redirects (the 10.4135 SAGE DOI above is excluded
    # the same way). Surfaced when lychee-action moved to v2.9, whose checker the
    # publisher blocks; v1.9 stopped at the doi.org 302 without hitting 403.
    "doi\\.org/10\\.1080/00330124\\.2019\\.1598271",
    "doi\\.org/10\\.1111/0033-0124\\.00252",
]

# Skip localhost URLs in tutorial code blocks
exclude_path = []

# Retry transient failures (GitHub frequently returns 502 on automated badge URL fetches).
max_retries = 3
retry_wait_time = 5

# Per-request timeout — default 20s leaves no room for slow DOI/Zenodo redirect chains.
# Two consecutive flaky failures (doi.org/10.32614/rj-2014-032,
# zenodo.org/account/settings/github/) in PR #100 (2026-05-02) prompted the bump.
timeout = 60

# Treat these HTTP statuses as success (transient gateway errors that resolve on retry but
# occasionally exhaust the retry budget on busy github.com/Zenodo endpoints).
accept = ["200", "429", "502", "503", "504"]
