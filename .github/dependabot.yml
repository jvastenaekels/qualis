# Dependabot config — weekly security & version updates (Wave 6 Task 10).
#
# Closes the Wave 6 spec item: "Dependabot / Renovate config presence."
#
# Three ecosystems:
#   * pip — reads src/backend/pyproject.toml. Qualis uses `uv` not pip
#     directly; Dependabot's pip ecosystem still parses pyproject.toml
#     for direct dependencies and proposes minor / patch upgrades.
#     Lockfile (uv.lock) is regenerated locally during PR review.
#   * npm — src/frontend/package-lock.json is the source of truth.
#   * github-actions — pinning policy keeps third-party actions on
#     SHAs (see ci.yml header); Dependabot proposes SHA + comment-tag
#     updates as the upstream releases new versions.
#
# Pull requests are opened in batches; the audit workflow gates merges.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/src/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    # `mando` is a transitive dependency pulled in only by `radon`.
    # radon 6.0.1 (latest) hard-caps it at `mando<0.8`, so a Dependabot
    # bump to mando>=0.8 produces an unsolvable pip resolution and breaks
    # the Scalingo deploy (PR #132 did exactly this). Its version is
    # dictated by radon — never bump it independently.
    #
    # `pydantic-core` is pinned exactly by pydantic (2.13.4 requires
    # `pydantic-core==2.46.4`). A standalone bump to 2.47.0 is unsatisfiable
    # and fails the Dependency Sync gate (PR #287). Its version is dictated
    # by pydantic — it moves when pydantic moves, never on its own.
    ignore:
      - dependency-name: "mando"
      - dependency-name: "pydantic-core"

  - package-ecosystem: "npm"
    directory: "/src/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Major bumps for these are breaking-API migrations, not routine
    # upgrades — their auto-PRs failed CI and were closed (PRs #130,
    # #136, #137, #138). Block the major line so Dependabot stops
    # recreating them; minor/patch still flow. Remove the relevant
    # entry when doing the dedicated migration for that package.
    ignore:
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
      - dependency-name: "zustand"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-zoom-pan-pinch"
        update-types: ["version-update:semver-major"]
      # tailwind-merge v3 supports Tailwind CSS v4 only — its published
      # README says "if you use Tailwind v3, use tailwind-merge v2.6.0".
      # Nothing enforces this: there is no peerDependency on tailwindcss
      # and no type error, so CI goes green while class merging silently
      # mis-handles the utilities renamed between v3 and v4 (shadow-sm →
      # shadow-xs, outline-none → outline-hidden, …). PR #190 was blocked
      # for exactly this. Paired with the tailwindcss entry above: lift
      # both together during the Tailwind v4 migration, never separately.
      - dependency-name: "tailwind-merge"
        update-types: ["version-update:semver-major"]
      # @babel/core 8 is a coordinated migration, not a drop-in bump. The
      # toolchain still holds @babel/plugin-transform-runtime@7, whose
      # `peer @babel/core@^7.0.0-0` conflicts with core 8, so npm ci fails
      # ERESOLVE (PR #269). babel is only pulled in by @rolldown/plugin-babel;
      # move the whole babel set together, or after Rolldown drops the babel
      # bridge, then lift this.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # @babel/plugin-transform-runtime is the other half of that same set.
      # Its 8.0 `peer @babel/core@^8.0.0` is the mirror conflict: with core
      # pinned at 7 (above), transform-runtime 8 fails npm ci ERESOLVE the
      # other way (PR #288). Lift together with @babel/core, never alone.
      - dependency-name: "@babel/plugin-transform-runtime"
        update-types: ["version-update:semver-major"]
      # typescript 7 (the native compiler) is the biggest build win here
      # (tsc -b 12.6s → 2.3s) but is not adoptable yet: it drops the JS API
      # (ts.createProgram / ts.resolveModuleName undefined), which two CI
      # gates depend on. dependency-cruiser 17.4.3 silently cruises 0 modules
      # under TS 7 (contract passes while checking nothing); 18.1.0 declines
      # TS ≥ 7 outright. knip 5.88 crashes. The full analysis lives in
      # src/frontend/tsconfig.app.json and commit 5f967361 (PR #297 hit exactly
      # this). Lift when dependency-cruiser ships TS 7 support and knip 6
      # (oxc-based) lands.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
