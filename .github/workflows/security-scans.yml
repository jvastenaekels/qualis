# Security scans — supply-chain CI gate (Wave 6 Task 3).
#
# Closes:
#   * F-01-002 partial-fix gap (gitleaks pre-commit / CI gate).
#   * Wave 1 NEW observation (pip-audit on every PR).
#   * Wave 1 NEW observation (npm-audit hardening as a dedicated gate).
#   * Wave 2 NEW observation (request.url-in-loggers lint).
#
# Each step fails the workflow only on high/critical findings (or
# non-zero exit for gitleaks, since gitleaks emits any-or-nothing).
# Tools are invoked as their own CLIs rather than third-party actions
# to keep the SHA-pin surface small.
#
# Pinning policy: see .github/workflows/ci.yml header.
name: Security Scans

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for `gitleaks detect --source .`
      - name: Install gitleaks
        run: |
          set -e
          GITLEAKS_VERSION=8.21.2
          # --fail makes curl exit non-zero on an HTTP error instead of writing
          # the error body to the output file, where it only surfaced later as
          # `gzip: stdin: not in gzip format` from tar — a message that names
          # the symptom and hides the cause. --retry covers the transient
          # release-download failures the runners hit (see the 2026-07-24
          # failure on main, green on a plain re-run).
          curl -sSL --fail --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          sudo install /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run gitleaks
        # `--gitleaksignore` defaults to .gitleaksignore at repo root.
        # `--redact` keeps any leak fingerprints out of the public log.
        run: gitleaks detect --source . --redact --verbose

  pip-audit:
    name: pip-audit (Python SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install dependencies
        run: cd src/backend && uv sync
      - name: Run pip-audit
        # Ignore list mirrors backend Makefile and ci.yml backend-lint;
        # rationale documented in SECURITY.md. Each --ignore-vuln has a
        # paired tracking entry in the audit backlog.
        run: |
          cd src/backend && uv run pip-audit \
            --ignore-vuln GHSA-wj6h-64fc-37mp \
            --ignore-vuln CVE-2026-3219 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-28684 \
            --ignore-vuln CVE-2026-25645

  npm-audit:
    name: npm audit (frontend SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run npm audit (high/critical only)
        # Only GHSA-vfj7-8cjw-p6xm (braces) is accepted: no patched release,
        # and all callers use repository-controlled build/lint glob patterns.
        # No application input reaches it. See SECURITY.md for the review and
        # removal criteria. Keep this gate in sync across both workflows.
        run: |
          set -e
          accepted='GHSA-vfj7-8cjw-p6xm'
          audit_json=$(npm audit --json) || true
          unknown=$(echo "$audit_json" | jq -r --arg a "$accepted" '
            [.vulnerabilities | to_entries[].value
             | select(.severity == "high" or .severity == "critical")
             | .via[] | objects
             | select((.url // "") | test($a) | not)
             | .url] | unique | join("\n")
          ')
          if [ -n "$unknown" ]; then
            echo "Unhandled high/critical advisories:"
            echo "$unknown"
            exit 1
          fi
          echo "All high+ advisories are within the SECURITY.md allowlist."

  semgrep:
    name: Semgrep (SAST — OWASP Top Ten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install semgrep
        # 1.95 imports pkg_resources at startup; Python 3.12+ slim envs
        # don't ship setuptools by default. Pin a recent version that
        # uses importlib.metadata instead.
        #
        # Retried at the shell level, not with pip's own --retries: that
        # option already defaults to 5 and covers only *establishing* a
        # connection. The 2026-07-24 failure on main was a stream that died
        # mid-transfer (ProtocolError: IncompleteRead, 11 MB of 50 MB read),
        # which pip surfaces instead of retrying. semgrep is a ~50 MB wheel,
        # so a truncated download is the failure mode to expect. --timeout 60
        # (default 15s) also gives a stalled socket room to recover.
        run: |
          set -e
          for attempt in 1 2 3; do
            if pip install --timeout 60 semgrep==1.150.0; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "pip install semgrep failed after 3 attempts"
              exit 1
            fi
            echo "attempt $attempt failed — retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
      - name: Run semgrep (OWASP Top Ten)
        # --error: exit non-zero on any finding (semgrep's own "error"
        # severity is high+). The OWASP Top Ten ruleset is the spec
        # default; tighter rulesets can be added in a follow-up.
        run: semgrep --config p/owasp-top-ten --error src/backend/app src/frontend/src

  logger-url-lint:
    name: Logger-URL lint (request.url scrubber bypass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run lint script
        # Pure stdlib AST walk; no install needed beyond Python.
        run: python src/backend/scripts/lint_logger_urls.py
